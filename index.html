<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Totem Admin — Painel de Conteúdo</title>
<style>
:root{--primary:#2563eb;--secondary:#1e3a8a;--bg:#f8fafc;--dark:#0f172a;--card:#fff;--border:#e2e8f0;--text:#1e293b;--muted:#64748b;--success:#059669;--danger:#dc2626;--warning:#d97706}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:#f8fafc}.login-card{width:min(400px,100%)}.brand-center{text-align:center;margin-bottom:28px}.logo-box{width:58px;height:58px;border-radius:16px;background:var(--primary);color:white;display:grid;place-items:center;margin:0 auto 15px;box-shadow:0 10px 25px #2563eb30}.brand-center h1{font-size:21px;margin:0}.brand-center p{color:var(--muted);font-size:14px;margin:6px 0}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 2px 7px #0f172a08}.login-card .card{padding:24px}.field{margin-bottom:16px}.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:10px 12px;outline:none;background:#fff}.field textarea{resize:vertical;min-height:90px}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px #2563eb15}.btn{border:0;border-radius:9px;padding:10px 15px;font-weight:650;display:inline-flex;align-items:center;gap:8px;justify-content:center}.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:#1d4ed8}.btn-light{background:#fff;border:1px solid var(--border);color:#475569}.btn-danger{background:#fee2e2;color:#b91c1c}.btn-success{background:#dcfce7;color:#15803d}.btn-block{width:100%}
.app{display:flex;min-height:100vh}.sidebar{width:255px;background:#fff;border-right:1px solid var(--border);position:fixed;left:0;top:0;bottom:0;display:flex;flex-direction:column;z-index:30}.side-head{height:64px;padding:0 20px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;gap:10px}.mini-logo{width:36px;height:36px;border-radius:9px;background:var(--primary);color:#fff;display:grid;place-items:center}.side-head strong{font-size:14px}.side-head small{display:block;color:#94a3b8;font-size:11px}.nav{padding:15px 11px;flex:1}.nav button{width:100%;border:0;background:none;text-align:left;padding:11px 12px;border-radius:9px;color:#475569;font-weight:600;display:flex;gap:12px;align-items:center;margin-bottom:3px}.nav button:hover{background:#f8fafc}.nav button.active{background:#eff6ff;color:#1d4ed8}.side-foot{padding:16px;border-top:1px solid #f1f5f9;color:#94a3b8;font-size:11px}.main{margin-left:255px;min-width:0;flex:1}.topbar{height:64px;background:#ffffffdc;backdrop-filter:blur(10px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:20}.topbar h1{font-size:18px;margin:0}.user{position:relative}.user-btn{border:1px solid var(--border);background:#fff;border-radius:999px;padding:4px 12px 4px 5px;display:flex;align-items:center;gap:8px;color:#475569}.avatar{width:28px;height:28px;border-radius:50%;background:#dbeafe;color:#1d4ed8;display:grid;place-items:center;font-size:12px;font-weight:700}.dropdown{position:absolute;right:0;top:42px;width:180px;background:#fff;border:1px solid var(--border);border-radius:9px;box-shadow:0 10px 25px #0f172a18;padding:6px}.dropdown button{width:100%;background:none;border:0;text-align:left;padding:9px;border-radius:6px}.dropdown button:hover{background:#f8fafc}.content{padding:24px;max-width:1400px;margin:auto}.muted{color:var(--muted)}.page-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.page-head h2{margin:0;font-size:20px}.page-head p{margin:5px 0 0;font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px}.stat{padding:18px}.stat .label{font-size:12px;color:var(--muted)}.stat .num{font-size:27px;font-weight:750;margin-top:5px}.stat .sub{font-size:11px;color:#94a3b8;margin-top:3px}
.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}.section{padding:20px}.section h3{font-size:14px;margin:0 0 15px}.bar{height:9px;background:#e2e8f0;border-radius:99px;overflow:hidden}.bar>span{display:block;height:100%;background:var(--primary);border-radius:99px}.chart{height:190px;display:flex;align-items:end;gap:10px;padding:20px 5px 4px}.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:end}.chart .fill{width:100%;max-width:38px;background:#60a5fa;border-radius:6px 6px 2px 2px;min-height:5px}.chart small{font-size:10px;color:#94a3b8}
.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.filters input,.filters select{border:1px solid #cbd5e1;border-radius:9px;padding:9px 11px;background:#fff;font-size:13px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th{text-align:left;background:#f8fafc;color:#64748b;font-size:11px;text-transform:uppercase;padding:12px}.table td{padding:12px;border-top:1px solid #f1f5f9;vertical-align:middle}.thumb{width:55px;height:40px;border-radius:6px;background:#f1f5f9;object-fit:cover;display:grid;place-items:center;color:#94a3b8;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.title-cell{display:flex;align-items:center;gap:10px;min-width:210px}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:650}.active-badge{background:#dcfce7;color:#15803d}.inactive-badge{background:#f1f5f9;color:#64748b}.type-badge{background:#eff6ff;color:#1d4ed8}.actions{display:flex;gap:5px;justify-content:flex-end}.icon-btn{border:1px solid var(--border);background:#fff;border-radius:7px;width:31px;height:31px}.icon-btn:hover{background:#f8fafc}.empty{text-align:center;padding:45px;color:#94a3b8}
.playlist{max-width:720px;margin:auto}.playlist-item{display:flex;align-items:center;gap:11px;padding:12px 14px;margin-bottom:9px}.drag{font-size:18px;color:#94a3b8;cursor:grab}.number{width:28px;height:28px;border-radius:50%;background:#f1f5f9;display:grid;place-items:center;font-size:12px;color:#64748b}.playlist-item .info{min-width:0;flex:1}.playlist-item .info strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.playlist-item .info small{color:#94a3b8}.move{display:flex;gap:4px}.move button{width:28px;height:28px;border:1px solid var(--border);background:#fff;border-radius:6px}
.settings{max-width:800px;margin:auto}.settings .section{margin-bottom:16px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.colors{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.color-input{display:flex;gap:8px;align-items:center;border:1px solid #cbd5e1;border-radius:9px;padding:5px}.color-input input[type=color]{width:35px;height:30px;border:0;padding:0;background:none}.orientation{display:flex;gap:10px}.orientation button{padding:13px 18px;border:1px solid var(--border);background:#fff;border-radius:9px}.orientation button.active{border-color:var(--primary);background:#eff6ff;color:#1d4ed8}
.modal-bg{position:fixed;inset:0;background:#0f172a88;display:grid;place-items:center;padding:15px;z-index:100}.modal{background:#fff;border-radius:15px;width:min(720px,100%);max-height:92vh;overflow:auto;box-shadow:0 25px 60px #0f172a35}.modal-head{padding:17px 20px;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center}.modal-head h3{margin:0;font-size:16px}.modal-body{padding:20px}.modal-foot{padding:14px 20px;border-top:1px solid #f1f5f9;display:flex;justify-content:flex-end;gap:9px}.types{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:18px}.type-option{border:1px solid var(--border);background:#fff;border-radius:8px;padding:10px 5px;font-size:11px;color:#64748b;text-align:center}.type-option.active{border-color:var(--primary);background:#eff6ff;color:#1d4ed8}.type-option span{font-size:19px;display:block;margin-bottom:3px}.switch-row{display:flex;gap:22px;flex-wrap:wrap}.switch{display:flex;align-items:center;gap:8px;font-size:13px}.switch input{width:17px;height:17px}.preview-bg{background:#0f172a;min-height:320px;border-radius:12px;display:grid;place-items:center;padding:20px;color:white;overflow:hidden}.preview-bg img,.preview-bg video{max-width:100%;max-height:360px;object-fit:contain;border-radius:8px}.preview-text{text-align:center;padding:25px;white-space:pre-wrap;width:100%}.preview-notice{width:100%;padding:25px;border-radius:12px;text-align:center}.toast{position:fixed;right:18px;bottom:18px;background:#0f172a;color:#fff;padding:11px 15px;border-radius:9px;box-shadow:0 10px 30px #0003;z-index:200;font-size:13px}.mobile-menu{display:none}
@media(max-width:900px){.sidebar{transform:translateX(-100%);transition:.2s}.sidebar.open{transform:none}.main{margin-left:0}.mobile-menu{display:block;border:0;background:none;font-size:20px}.stats{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.colors,.form-grid{grid-template-columns:1fr}.content{padding:16px}.topbar{padding:0 16px}.hide-mobile{display:none}.types{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.page-head{align-items:flex-start;flex-direction:column}.table th:nth-child(n+4),.table td:nth-child(n+4){display:none}.types{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="loginScreen" class="login">
  <div class="login-card">
    <div class="brand-center"><div class="logo-box">▣</div><h1>Painel Administrativo</h1><p>Gerencie o conteúdo exibido nos totens</p></div>
    <div class="card" style="padding:24px">
      <div id="loginError" class="hidden" style="background:#fef2f2;color:#b91c1c;padding:10px;border-radius:8px;font-size:13px;margin-bottom:15px"></div>
      <button id="googleLoginBtn" class="btn btn-primary btn-block">Entrar com Google</button>
      <p style="font-size:11px;color:#94a3b8;text-align:center;margin:14px 0 0">Acesso restrito aos e-mails autorizados da escola.</p>
    </div>
  </div>
</div>

<div id="app" class="app hidden">
  <aside id="sidebar" class="sidebar">
    <div class="side-head"><div class="mini-logo">▣</div><div><strong>Totem Admin</strong><small>Painel de conteúdo</small></div></div>
    <nav class="nav">
      <button data-page="dashboard" class="active">▦ <span>Dashboard</span></button>
      <button data-page="contents">▤ <span>Conteúdos</span></button>
      <button data-page="playlist">☷ <span>Playlist</span></button>
      <button data-page="settings">⚙ <span>Configurações</span></button>
    </nav>
    <div class="side-foot">Sistema de gerenciamento de totens digitais</div>
  </aside>
  <main class="main">
    <header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button id="mobileMenu" class="mobile-menu">☰</button><h1 id="pageTitle">Dashboard</h1></div><div class="user"><button id="userBtn" class="user-btn"><span class="avatar" id="userAvatar">A</span><span id="userEmail" class="hide-mobile"></span>⌄</button><div id="userMenu" class="dropdown hidden"><div style="padding:7px 9px;color:#94a3b8;font-size:11px;border-bottom:1px solid #f1f5f9" id="menuEmail"></div><button id="logoutBtn" style="color:#dc2626">↪ Sair</button></div></div></header>
    <div id="page" class="content"></div>
  </main>
</div>

<div id="modalBg" class="modal-bg hidden"><div class="modal" id="modal"></div></div>
<div id="toast" class="toast hidden"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import{getFirestore,doc,setDoc,onSnapshot}from"https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
const firebaseConfig={apiKey:"AIzaSyCP4e4MNedGPXCbMdZ-lOQSzmvNrk5GLyc",authDomain:"escola-jg-c06b9.firebaseapp.com",projectId:"escola-jg-c06b9",storageBucket:"escola-jg-c06b9.firebasestorage.app",messagingSenderId:"820418788442",appId:"1:820418788442:web:aee8b0d502096dbda76c63"};
const fbApp=initializeApp(firebaseConfig),fs=getFirestore(fbApp),auth=getAuth(fbApp),provider=new GoogleAuthProvider();
const ALLOWED=['rafael.aferreira2@aluno.edu.es.gov.br','marlene.aleite@educador.edu.es.gov.br'];
window.docRef=doc(fs,'totem','data');window.fsSetDoc=setDoc;window.fsOnSnapshot=onSnapshot;
window.dispatchEvent(new Event('fb-ready'));
document.getElementById('googleLoginBtn').onclick=()=>{
 document.getElementById('loginError').classList.add('hidden');
 signInWithPopup(auth,provider).catch(e=>{document.getElementById('loginError').textContent='Falha ao entrar: '+e.message;document.getElementById('loginError').classList.remove('hidden')});
};
document.getElementById('logoutBtn').onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{
 const loginScreen=document.getElementById('loginScreen'),appEl=document.getElementById('app');
 if(u&&ALLOWED.includes(u.email)){
  document.getElementById('userEmail').textContent=u.email;
  document.getElementById('menuEmail').textContent=u.email;
  document.getElementById('userAvatar').textContent=u.email[0].toUpperCase();
  loginScreen.classList.add('hidden');appEl.classList.remove('hidden');
  if(window.render)window.render();
 }else if(u){
  signOut(auth);
  document.getElementById('loginError').textContent='E-mail não autorizado a acessar este painel.';
  document.getElementById('loginError').classList.remove('hidden');
 }else{
  loginScreen.classList.remove('hidden');appEl.classList.add('hidden');
 }
});
</script>
<script>
const defaults={
 settings:{schoolName:'Minha Escola',logoUrl:'',primaryColor:'#2563eb',secondaryColor:'#1e3a8a',backgroundColor:'#0f172a',defaultImageDuration:10,defaultTransition:'fade',screenOrientation:'landscape'},
 contents:[
  {id:'1',type:'notice',title:'Bem-vindos!',description:'Bem-vindos ao nosso totem digital.',duration:8,active:true,order:0,noticeLevel:'info'},
  {id:'2',type:'text',title:'Horário das aulas',description:'Confira os horários e avisos da escola.',duration:10,active:true,order:1,textColor:'#ffffff',backgroundColor:'#1e3a8a',textSize:'lg',textAlign:'center'},
  {id:'3',type:'event',title:'Reunião de pais',description:'Reunião com responsáveis',duration:10,active:false,order:2,eventDate:'2026-09-20',eventTime:'18:30',eventLocation:'Auditório'}
 ]};
let db=structuredClone(defaults); let currentPage='dashboard'; let editId=null; let selectedType='image'; let uploadedMedia=''; let uploadedThumb='';
function save(){window.fsSetDoc(window.docRef,db).catch(e=>toast('Erro ao salvar: '+e.message))}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(window._toast);window._toast=setTimeout(()=>t.classList.add('hidden'),2300)}
function typeLabel(t){return {image:'Imagem',video:'Vídeo',text:'Texto',notice:'Aviso',event:'Evento'}[t]||t}
function typeIcon(t){return {image:'▧',video:'▶',text:'T',notice:'!',event:'◷'}[t]||'•'}
function setPage(p){
 currentPage=p; document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));
 document.getElementById('pageTitle').textContent={dashboard:'Dashboard',contents:'Conteúdos',playlist:'Playlist',settings:'Configurações'}[p];
 document.getElementById('sidebar').classList.remove('open'); render();
}
function render(){if(currentPage==='dashboard')renderDashboard();if(currentPage==='contents')renderContents();if(currentPage==='playlist')renderPlaylist();if(currentPage==='settings')renderSettings()}
function renderDashboard(){
 const total=db.contents.length, active=db.contents.filter(x=>x.active).length, inactive=total-active;
 const totalSec=db.contents.reduce((a,x)=>a+(+x.duration||0),0);
 const types={image:0,video:0,text:0,notice:0,event:0};db.contents.forEach(x=>types[x.type]=(types[x.type]||0)+1);
 const days=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'], vals=[active+1,total+2,Math.max(1,active-1),active+3,Math.max(2,active),active+1,Math.max(1,active-2)];
 document.getElementById('page').innerHTML=`
 <div class="page-head"><div><h2>Visão geral</h2><p>Acompanhe os conteúdos e a configuração do seu totem.</p></div><button class="btn btn-primary" onclick="openContent()">＋ Adicionar conteúdo</button></div>
 <div class="stats">
  <div class="card stat"><div class="label">Total de conteúdos</div><div class="num">${total}</div><div class="sub">cadastrados</div></div>
  <div class="card stat"><div class="label">Conteúdos ativos</div><div class="num">${active}</div><div class="sub">${total?Math.round(active/total*100):0}% do total</div></div>
  <div class="card stat"><div class="label">Conteúdos inativos</div><div class="num">${inactive}</div><div class="sub">não exibidos</div></div>
  <div class="card stat"><div class="label">Duração da playlist</div><div class="num">${totalSec}s</div><div class="sub">tempo configurado</div></div>
 </div>
 <div class="grid2">
  <section class="card section"><h3>Conteúdos por tipo</h3>${Object.entries(types).map(([k,v])=>`<div style="margin:13px 0"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px"><span>${typeLabel(k)}</span><span class="muted">${v}</span></div><div class="bar"><span style="width:${total?Math.max(v/total*100, v?5:0):0}%"></span></div></div>`).join('')}</section>
  <section class="card section"><h3>Atividade recente</h3><div class="chart">${vals.map((v,i)=>`<div class="col"><div class="fill" style="height:${Math.min(90,20+v*12)}%"></div><small>${days[i]}</small></div>`).join('')}</div></section>
 </div>
 <section class="card section" style="margin-top:18px"><h3>Estado do sistema</h3><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px"><div style="padding:13px;background:#f0fdf4;border-radius:9px;color:#166534;font-size:13px">● Conteúdos locais funcionando</div><div style="padding:13px;background:#eff6ff;border-radius:9px;color:#1d4ed8;font-size:13px">● Configurações salvas</div><div style="padding:13px;background:#fffbeb;border-radius:9px;color:#92400e;font-size:13px">● Sincronizado via Firebase</div></div></section>`;
}
function renderContents(){
 const q=(window.contentSearch||'').toLowerCase(), ft=window.contentType||'all', fs=window.contentStatus||'all';
 let arr=[...db.contents].sort((a,b)=>a.order-b.order).filter(x=>(!q||x.title.toLowerCase().includes(q)||x.description?.toLowerCase().includes(q))&&(ft==='all'||x.type===ft)&&(fs==='all'||(fs==='active'?x.active:!x.active)));
 document.getElementById('page').innerHTML=`
 <div class="page-head"><div><h2>Conteúdos</h2><p>Cadastre, edite e controle tudo que aparece no totem.</p></div><button class="btn btn-primary" onclick="openContent()">＋ Adicionar conteúdo</button></div>
 <div class="filters"><input id="searchContent" value="${esc(q)}" placeholder="Pesquisar conteúdo..." oninput="window.contentSearch=this.value;renderContents()"><select onchange="window.contentType=this.value;renderContents()"><option value="all">Todos os tipos</option>${Object.keys(types).map(t=>`<option value="${t}" ${ft===t?'selected':''}>${typeLabel(t)}</option>`).join('')}</select><select onchange="window.contentStatus=this.value;renderContents()"><option value="all">Todos os status</option><option value="active" ${fs==='active'?'selected':''}>Ativos</option><option value="inactive" ${fs==='inactive'?'selected':''}>Inativos</option></select></div>
 <div class="card table-wrap"><table class="table"><thead><tr><th>Conteúdo</th><th>Tipo</th><th>Status</th><th>Ordem</th><th>Duração</th><th>Ações</th></tr></thead><tbody>${arr.length?arr.map((x,i)=>`<tr><td><div class="title-cell"><div class="thumb">${x.thumbnailUrl||x.mediaUrl?`<img src="${esc(x.thumbnailUrl||x.mediaUrl)}">`:typeIcon(x.type)}</div><div><strong>${esc(x.title)}</strong><div class="muted" style="font-size:11px">${esc((x.description||'').slice(0,55))}</div></div></div></td><td><span class="badge type-badge">${typeIcon(x.type)} ${typeLabel(x.type)}</span></td><td><span class="badge ${x.active?'active-badge':'inactive-badge'}">${x.active?'Ativo':'Inativo'}</span></td><td>${x.order+1}</td><td>${x.duration}s</td><td><div class="actions"><button class="icon-btn" title="Pré-visualizar" onclick="previewContent('${x.id}')">◉</button><button class="icon-btn" title="Ativar/desativar" onclick="toggleContent('${x.id}')">${x.active?'◉':'○'}</button><button class="icon-btn" title="Editar" onclick="openContent('${x.id}')">✎</button><button class="icon-btn" title="Excluir" onclick="deleteContent('${x.id}')">×</button></div></td></tr>`).join(''):`<tr><td colspan="6" class="empty">Nenhum conteúdo encontrado.</td></tr>`}</tbody></table></div>`;
}
const types={image:1,video:1,text:1,notice:1,event:1};
function renderPlaylist(){
 let arr=[...db.contents].sort((a,b)=>a.order-b.order);
 document.getElementById('page').innerHTML=`<div class="playlist"><div class="page-head"><div><h2>Playlist</h2><p>Defina a ordem de exibição no totem.</p></div><span class="badge active-badge">✓ Salvo automaticamente</span></div>${arr.length?arr.map((x,i)=>`<div class="card playlist-item"><span class="drag">☷</span><span class="number">${i+1}</span><div class="thumb">${x.thumbnailUrl||x.mediaUrl?`<img src="${esc(x.thumbnailUrl||x.mediaUrl)}">`:typeIcon(x.type)}</div><div class="info"><strong>${esc(x.title)}</strong><small>${typeLabel(x.type)} · ${x.duration}s ${x.active?'':'· Inativo'}</small></div><div class="move"><button onclick="moveItem(${i},-1)" ${i===0?'disabled':''}>↑</button><button onclick="moveItem(${i},1)" ${i===arr.length-1?'disabled':''}>↓</button></div></div>`).join(''):`<div class="card empty">Nenhum conteúdo cadastrado ainda.</div>`}</div>`;
}
function renderSettings(){
 const s=db.settings;
 document.getElementById('page').innerHTML=`<div class="settings"><div class="page-head"><div><h2>Configurações</h2><p>Personalize a identidade e o comportamento do totem.</p></div></div>
 <section class="card section"><h3>Identidade da escola</h3><div class="form-grid"><div class="field"><label>Nome da escola</label><input id="schoolName" value="${esc(s.schoolName)}"></div><div class="field"><label>Logo</label><input id="logoFile" type="file" accept="image/*"><div style="font-size:11px;color:#94a3b8;margin-top:5px">${s.logoUrl?'Logo carregada':'Nenhum logo selecionado'}</div></div></div></section>
 <section class="card section"><h3>Cores principais</h3><div class="colors">${[['primaryColor','Cor primária'],['secondaryColor','Cor secundária'],['backgroundColor','Cor de fundo']].map(([id,l])=>`<div class="field"><label>${l}</label><div class="color-input"><input id="${id}" type="color" value="${s[id]}"><input id="${id}Text" value="${s[id]}" style="border:0;padding:4px"></div></div>`).join('')}</div></section>
 <section class="card section"><h3>Configurações gerais do totem</h3><div class="form-grid"><div class="field"><label>Tempo padrão das imagens (segundos)</label><input id="defaultDuration" type="number" min="1" value="${s.defaultImageDuration}"></div><div class="field"><label>Transição padrão</label><select id="defaultTransition"><option value="fade">Fade (esmaecer)</option><option value="slide-left">Deslizar da direita</option><option value="slide-right">Deslizar da esquerda</option><option value="zoom">Zoom</option><option value="none">Sem animação</option></select></div></div><div class="field"><label>Orientação da tela</label><div class="orientation"><button id="landBtn" onclick="setOrientation('landscape')">▣ Paisagem</button><button id="portBtn" onclick="setOrientation('portrait')">▯ Retrato</button></div></div></section>
 <div style="display:flex;justify-content:flex-end"><button class="btn btn-primary" onclick="saveSettings()">✓ Salvar configurações</button></div></div>`;
 document.getElementById('defaultTransition').value=s.defaultTransition;
 document.getElementById('landBtn').classList.toggle('active',s.screenOrientation==='landscape');document.getElementById('portBtn').classList.toggle('active',s.screenOrientation==='portrait');
 ['primaryColor','secondaryColor','backgroundColor'].forEach(id=>{document.getElementById(id).oninput=e=>{document.getElementById(id+'Text').value=e.target.value};document.getElementById(id+'Text').oninput=e=>{document.getElementById(id).value=e.target.value}});
}
function setOrientation(v){db.settings.screenOrientation=v;renderSettings()}
function saveSettings(){
 const s=db.settings;s.schoolName=document.getElementById('schoolName').value||'Minha Escola';s.primaryColor=document.getElementById('primaryColor').value;s.secondaryColor=document.getElementById('secondaryColor').value;s.backgroundColor=document.getElementById('backgroundColor').value;s.defaultImageDuration=Math.max(1,+document.getElementById('defaultDuration').value||10);s.defaultTransition=document.getElementById('defaultTransition').value;
 const file=document.getElementById('logoFile').files[0];if(file){const r=new FileReader();r.onload=()=>{s.logoUrl=r.result;save();applyTheme();renderSettings();toast('Configurações salvas')};r.readAsDataURL(file)}else{save();applyTheme();toast('Configurações salvas')}
}
function applyTheme(){document.documentElement.style.setProperty('--primary',db.settings.primaryColor);document.documentElement.style.setProperty('--secondary',db.settings.secondaryColor);document.documentElement.style.setProperty('--dark',db.settings.backgroundColor)}
function openContent(id){
 editId=id||null;let x=id?db.contents.find(c=>c.id===id):null;selectedType=x?.type||'image';uploadedMedia=x?.mediaUrl||'';uploadedThumb=x?.thumbnailUrl||'';
 const d=x||{title:'',description:'',duration:db.settings.defaultImageDuration,active:true,transition:db.settings.defaultTransition,exitTransition:'fade',autoplay:true,loopVideo:true,textColor:'#0f172a',backgroundColor:'#ffffff',textSize:'lg',textAlign:'center',noticeLevel:'info',eventDate:'',eventTime:'',eventLocation:''};
 document.getElementById('modal').innerHTML=`<div class="modal-head"><h3>${id?'Editar conteúdo':'Adicionar conteúdo'}</h3><button class="icon-btn" onclick="closeModal()">×</button></div><form id="contentForm"><div class="modal-body">${!id?`<label style="display:block;font-size:13px;font-weight:600;margin-bottom:7px">Tipo de conteúdo</label><div class="types">${['image','video','text','notice','event'].map(t=>`<button type="button" class="type-option ${selectedType===t?'active':''}" onclick="selectType('${t}')"><span>${typeIcon(t)}</span>${typeLabel(t)}</button>`).join('')}</div>`:''}<div id="dynamicFields"></div></div><div class="modal-foot"><button type="button" class="btn btn-light" onclick="closeModal()">Cancelar</button><button class="btn btn-primary">${id?'Salvar alterações':'Adicionar conteúdo'}</button></div></form>`;
 fillDynamic(d);document.getElementById('contentForm').onsubmit=e=>{e.preventDefault();saveContent(d)};
 document.getElementById('modalBg').classList.remove('hidden');
}
function selectType(t){selectedType=t;document.querySelectorAll('.type-option').forEach(b=>b.classList.toggle('active',b.textContent.trim().endsWith(typeLabel(t))));fillDynamic({title:'',description:'',duration:db.settings.defaultImageDuration,active:true,transition:db.settings.defaultTransition,exitTransition:'fade',autoplay:true,loopVideo:true,textColor:'#0f172a',backgroundColor:'#ffffff',textSize:'lg',textAlign:'center',noticeLevel:'info',eventDate:'',eventTime:'',eventLocation:''})}
function fillDynamic(d){
 let f=`<div class="field"><label>Título</label><input id="cTitle" required value="${esc(d.title)}" placeholder="Ex: Feira de Ciências 2027"></div>`;
 if(selectedType==='image')f+=mediaFields('Imagem','image/*',uploadedMedia);
 if(selectedType==='video')f+=mediaFields('Vídeo','video/*',uploadedMedia)+mediaFields('Thumbnail (capa)','image/*',uploadedThumb,'thumb');
 if(selectedType==='text')f+=`<div class="field"><label>Texto</label><textarea id="cDesc" placeholder="Digite o texto que aparecerá no totem">${esc(d.description)}</textarea></div><div class="form-grid"><div class="field"><label>Cor do texto</label><input id="cTextColor" type="color" value="${d.textColor||'#0f172a'}"></div><div class="field"><label>Cor de fundo</label><input id="cBgColor" type="color" value="${d.backgroundColor||'#fff'}"></div></div><div class="form-grid"><div class="field"><label>Tamanho</label><select id="cTextSize"><option value="sm">Pequeno</option><option value="md">Médio</option><option value="lg">Grande</option><option value="xl">Extra grande</option></select></div><div class="field"><label>Alinhamento</label><select id="cTextAlign"><option>left</option><option>center</option><option>right</option></select></div></div>`;
 if(selectedType==='notice')f+=`<div class="field"><label>Mensagem</label><textarea id="cDesc">${esc(d.description)}</textarea></div><div class="field"><label>Nível do aviso</label><select id="cNotice"><option value="info">Informação</option><option value="atencao">Atenção</option><option value="urgente">Urgente</option></select></div>`;
 if(selectedType==='event')f+=`<div class="field"><label>Descrição</label><textarea id="cDesc">${esc(d.description)}</textarea></div><div class="form-grid"><div class="field"><label>Data</label><input id="cDate" type="date" value="${d.eventDate||''}"></div><div class="field"><label>Horário</label><input id="cTime" type="time" value="${d.eventTime||''}"></div></div><div class="field"><label>Local</label><input id="cLocation" value="${esc(d.eventLocation||'')}"></div>`;
 if(selectedType!=='text'&&selectedType!=='notice'&&selectedType!=='event')f+=`<div class="field"><label>Descrição</label><textarea id="cDesc">${esc(d.description)}</textarea></div>`;
 f+=`<div class="form-grid"><div class="field"><label>Duração (segundos)</label><input id="cDuration" type="number" min="1" value="${d.duration||10}"></div><div class="field"><label>Entrada</label><select id="cTransition"><option value="fade">Fade</option><option value="slide-left">Deslizar esquerda</option><option value="slide-right">Deslizar direita</option><option value="slide-up">Deslizar cima</option><option value="slide-down">Deslizar baixo</option><option value="zoom">Zoom</option><option value="none">Sem animação</option></select></div></div><div class="switch-row"><label class="switch"><input id="cActive" type="checkbox" ${d.active?'checked':''}> Conteúdo ativo</label>${selectedType==='video'?`<label class="switch"><input id="cAutoplay" type="checkbox" ${d.autoplay?'checked':''}> Reprodução automática</label><label class="switch"><input id="cLoop" type="checkbox" ${d.loopVideo?'checked':''}> Repetir vídeo</label>`:''}</div>`;
 document.getElementById('dynamicFields').innerHTML=f;['cTransition','cTextSize','cTextAlign','cNotice'].forEach(id=>{const el=document.getElementById(id);if(el&&d[id.replace('c','').replace('Transition','transition').replace('TextSize','textSize').replace('TextAlign','textAlign').replace('Notice','noticeLevel')]){}});if(document.getElementById('cTransition'))document.getElementById('cTransition').value=d.transition||'fade';if(document.getElementById('cTextSize'))document.getElementById('cTextSize').value=d.textSize||'lg';if(document.getElementById('cTextAlign'))document.getElementById('cTextAlign').value=d.textAlign||'center';if(document.getElementById('cNotice'))document.getElementById('cNotice').value=d.noticeLevel||'info';
 document.querySelectorAll('#dynamicFields input[type=file]').forEach(el=>el.onchange=e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{if(el.id==='cMedia')uploadedMedia=r.result;else uploadedThumb=r.result;el.parentElement.querySelector('.file-name').textContent=file.name};r.readAsDataURL(file)});
}
function mediaFields(label,accept,url,thumb=''){return `<div class="field"><label>${label}</label><input id="${thumb?'cThumb':'cMedia'}" type="file" accept="${accept}">${url?`<div class="file-name" style="font-size:11px;color:#059669;margin-top:5px">Arquivo carregado</div>`:`<div class="file-name" style="font-size:11px;color:#94a3b8;margin-top:5px">Nenhum arquivo selecionado</div>`}</div>`}
function saveContent(old){
 const g=id=>document.getElementById(id), x=editId?db.contents.find(c=>c.id===editId):{id:uid(),order:db.contents.length};
 x.type=selectedType;x.title=g('cTitle').value;x.description=g('cDesc')?.value||'';x.duration=Math.max(1,+g('cDuration').value||10);x.active=g('cActive').checked;x.transition=g('cTransition')?.value||'fade';x.exitTransition='fade';
 if(uploadedMedia)x.mediaUrl=uploadedMedia;else delete x.mediaUrl;if(uploadedThumb)x.thumbnailUrl=uploadedThumb;else delete x.thumbnailUrl;
 if(selectedType==='video'){x.autoplay=g('cAutoplay').checked;x.loopVideo=g('cLoop').checked}
 if(selectedType==='text'){x.textColor=g('cTextColor').value;x.backgroundColor=g('cBgColor').value;x.textSize=g('cTextSize').value;x.textAlign=g('cTextAlign').value}
 if(selectedType==='notice')x.noticeLevel=g('cNotice').value;
 if(selectedType==='event'){x.eventDate=g('cDate').value;x.eventTime=g('cTime').value;x.eventLocation=g('cLocation').value}
 if(!editId)db.contents.push(x);save();closeModal();render();toast(editId?'Conteúdo atualizado':'Conteúdo adicionado');
}
function closeModal(){document.getElementById('modalBg').classList.add('hidden')}
function toggleContent(id){const x=db.contents.find(c=>c.id===id);x.active=!x.active;save();render();toast(x.active?'Conteúdo ativado':'Conteúdo desativado')}
function deleteContent(id){const x=db.contents.find(c=>c.id===id);if(!confirm(`Excluir "${x.title}"?`))return;db.contents=db.contents.filter(c=>c.id!==id);db.contents.forEach((x,i)=>x.order=i);save();render();toast('Conteúdo excluído')}
function moveItem(i,dir){let a=[...db.contents].sort((x,y)=>x.order-y.order),j=i+dir;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];a.forEach((x,k)=>x.order=k);db.contents=a;save();renderPlaylist();toast('Ordem atualizada')}
function previewContent(id){
 const x=db.contents.find(c=>c.id===id);let body='';
 if(x.type==='image'&&x.mediaUrl)body=`<img src="${esc(x.mediaUrl)}">`;else if(x.type==='video'&&x.mediaUrl)body=`<video src="${esc(x.mediaUrl)}" controls ${x.autoplay?'autoplay':''} ${x.loopVideo?'loop':''}></video>`;else if(x.type==='text')body=`<div class="preview-text" style="color:${x.textColor||'#fff'};background:${x.backgroundColor||'#fff'};font-size:${({sm:'16px',md:'24px',lg:'34px',xl:'48px'})[x.textSize]||'34px'};text-align:${x.textAlign||'center'}">${esc(x.description)}</div>`;else if(x.type==='notice')body=`<div class="preview-notice" style="background:${x.noticeLevel==='urgente'?'#fee2e2':x.noticeLevel==='atencao'?'#fef3c7':'#dbeafe'};color:${x.noticeLevel==='urgente'?'#991b1b':x.noticeLevel==='atencao'?'#92400e':'#1e40af'}"><b>${esc(x.title)}</b><p>${esc(x.description)}</p></div>`;else body=`<div style="text-align:center"><div style="font-size:44px">◷</div><h2>${esc(x.title)}</h2><p>${esc(x.description)}</p><p>${esc(x.eventDate||'')} ${esc(x.eventTime||'')}</p><p>${esc(x.eventLocation||'')}</p></div>`;
 document.getElementById('modal').innerHTML=`<div class="modal-head"><h3>Pré-visualização</h3><button class="icon-btn" onclick="closeModal()">×</button></div><div class="modal-body"><div class="preview-bg">${body}</div><div style="margin-top:12px;font-size:12px;color:#64748b">Duração: ${x.duration}s · ${typeLabel(x.type)} · ${x.active?'Ativo':'Inativo'}</div></div><div class="modal-foot"><button class="btn btn-light" onclick="closeModal()">Fechar</button></div>`;document.getElementById('modalBg').classList.remove('hidden')
}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>setPage(b.dataset.page));
document.getElementById('mobileMenu').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
document.getElementById('userBtn').onclick=()=>document.getElementById('userMenu').classList.toggle('hidden');
document.getElementById('modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')closeModal()});
function startSync(){window.fsOnSnapshot(window.docRef,s=>{db=s.exists()?s.data():structuredClone(defaults);if(!s.exists())window.fsSetDoc(window.docRef,db);applyTheme();if(!document.getElementById('app').classList.contains('hidden'))render()},e=>toast('Erro de conexão: '+e.message))}
if(window.docRef)startSync();else window.addEventListener('fb-ready',startSync,{once:true});
</script>
</body>
</html>
